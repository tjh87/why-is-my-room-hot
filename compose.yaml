services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: hotroom, POSTGRES_HOST_AUTH_METHOD: trust }
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data", "./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports: ["8123:8123"]
    volumes: ["clickhouse-data:/var/lib/clickhouse", "./db/clickhouse.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
volumes: { postgres-data: {}, clickhouse-data: {} }
